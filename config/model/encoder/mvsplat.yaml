name: mvsplat
# Official RE10K default model (config/experiment/re10k.yaml), not the smaller
# base/ablation model in upstream config/model/encoder/costvolume.yaml.
d_feature: 128
num_depth_candidates: 128
downscale_factor: 4
shim_patch_size: 4
multiview_trans_attn_split: 2
costvolume_unet_feat_dim: 128
costvolume_unet_channel_mult: [1, 1, 1]
costvolume_unet_attn_res: [4]
depth_unet_feat_dim: 32
depth_unet_attn_res: [16]
depth_unet_channel_mult: [1, 1, 1, 1, 1]
gaussian_adapter:
  gaussian_scale_min: 0.5
  gaussian_scale_max: 15.0
  sh_degree: 4
return_depth: true
train_depth_only: false
supervise_intermediate_depth: false
